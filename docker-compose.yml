services:
  jira-oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - ./oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  jira-kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0"
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://jira-kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15

  jira-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      _JAVA_OPTIONS: "-XX:UseSVE=0"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: jira-kafka:19092
    depends_on:
      - jira-kafka

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://jira-elasticsearch:9200
    depends_on:
      - jira-elasticsearch

  jira-transformer:
    build: ./transformer
    env_file: .env
    environment:
      KAFKA_BROKERS: jira-kafka:19092
      ELASTIC_URL: http://jira-elasticsearch:9200
    depends_on:
      jira-kafka:
        condition: service_healthy
      jira-elasticsearch:
        condition: service_healthy
    restart: on-failure

  jira-extractor:
    build: ./extractor
    env_file: .env
    environment:
      ORACLE_URL: jdbc:oracle:thin:@//jira-oracle:1521/FREEPDB1
      KAFKA_BROKERS: jira-kafka:19092
    depends_on:
      jira-kafka:
        condition: service_healthy
      jira-elasticsearch:
        condition: service_healthy
    restart: on-failure
